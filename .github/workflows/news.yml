# F1 뉴스 자동 갱신 — 1시간마다 뉴스를 받아 번역해 20192157_황휘/data/news.json에 저장한다.
# 사이트(news.js · home.js)는 이 파일을 읽는다. 자세한 설명은 20192157_황휘/tools/fetch_news.py
name: F1 뉴스 갱신

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (정각은 GitHub가 붐벼서 늦어짐)
  workflow_dispatch:        # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: f1-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 뉴스 받기
        working-directory: 20192157_황휘
        run: python tools/fetch_news.py
      - name: 바뀌었으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "20192157_황휘/data/news.json"
          if git diff --cached --quiet; then
            echo "새 뉴스 없음"
          else
            git commit -m "뉴스 자동 갱신 ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git pull --rebase
            git push
          fi
