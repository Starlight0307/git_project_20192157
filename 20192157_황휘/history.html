<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>역대 기록 - PROJECT_TELEMETRY</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/motion.css">
    <link rel="stylesheet" href="css/bgm.css">
    
    <style>
        .history-hero {
            background: linear-gradient(rgba(17, 17, 21, 0.8), rgba(17, 17, 21, 1)), url('https://images.unsplash.com/photo-1532983330958-4b32fceea6a8?q=80&w=2070&auto=format&fit=crop') center/cover;
            padding: 130px 0 60px 0;
            border-bottom: 2px solid #FFD700;
        }

        .champion-card {
            background: rgba(30, 30, 35, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2); 
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            padding: 15px 25px;
            margin-bottom: 15px;
        }

        .champion-card:hover {
            background: rgba(40, 40, 45, 0.9);
            transform: translateX(10px);
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.1);
        }

        .year-badge {
            font-size: 2rem;
            font-weight: 900;
            font-family: 'Urbanist', sans-serif;
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            min-width: 100px;
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <header class="history-hero text-center">
        <div class="container">
            <h1 class="fw-black text-white text-uppercase mb-2" style="font-size: 3rem; letter-spacing: -1px;">
                HALL OF <span style="color: #FFD700;">FAME</span>
            </h1>
            <p class="text-white-50 font-noto mb-0 fs-5">역대 포뮬러 1 월드 챔피언 기록</p>
        </div>
    </header>

    <section class="py-5" style="min-height: 50vh;">
        <div class="container">
            <h4 class="text-white font-urbanist fw-bold mb-4"><i class="fa-solid fa-crown me-2" style="color: #FFD700;"></i>역대 월드 챔피언 (15년전까지)</h4>
            
            <div id="history-container">
                <div class="col-12 text-center text-white-50 py-5">
                    <i class="fa-solid fa-spinner fa-spin fa-3x mb-3"></i>
                    <p class="font-noto mt-3">역대 챔피언 기록을 불러오는 중입니다...</p>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/circuitData.js"></script>
    <script src="script/common.js"></script>
    <script src="script/history.js"></script>

    <script src="script/hover-en.js"></script>
    <script src="script/motion.js"></script>
    <script src="script/bgm.js"></script>
</body>
</html>
