<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>드라이버 순위 - PROJECT_TELEMETRY</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/motion.css">
    <link rel="stylesheet" href="css/bgm.css">
    <link rel="stylesheet" href="css/polish.css">
    
    <style>
        .standings-hero {
            background: linear-gradient(rgba(17, 17, 21, 0.8), rgba(17, 17, 21, 1)), url('img/circuit/silverstone.jpg') center/cover;
            padding: 130px 0 60px 0;
            border-bottom: 2px solid #e10600;
        }

        .driver-row {
            background: rgba(30, 30, 35, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .driver-row:hover {
            background: rgba(40, 40, 45, 0.9);
            transform: translateX(10px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .team-color-bar {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
        }

        .position-badge {
            width: 50px;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 900;
            font-family: 'Urbanist', sans-serif;
            color: #fff;
        }
        .pos-1 { color: #FFD700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
        .pos-2 { color: #C0C0C0; }
        .pos-3 { color: #CD7F32; }

        .driver-photo-container {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.05);
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            border: 2px solid transparent;
            z-index: 2;
        }
        .driver-photo {
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        .bg-watermark {
            position: absolute;
            right: 130px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            opacity: 0.25; 
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 0;
        }
        
        .driver-row:hover .bg-watermark {
            opacity: 0.6; 
            transform: translateY(-50%) scale(1.05);
        }

        .bg-watermark .watermark-team-logo {
            height: 45px;
            margin-right: 20px;
            object-fit: contain;
        }

        .bg-watermark .watermark-number-img {
            height: 55px;
            object-fit: contain;
        }

        .fallback-number {
            font-size: 4.5rem;
            font-weight: 900;
            font-family: 'Urbanist', sans-serif;
            font-style: italic;
            line-height: 1;
        }

        .info-container {
            z-index: 2;
            position: relative;
        }

        .team-logo-sm {
            height: 16px;
            width: auto;
            max-width: 40px;
            object-fit: contain;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.2));
        }

        .points-display {
            background: rgba(225, 6, 0, 0.1);
            color: #e10600;
            border: 1px solid rgba(225, 6, 0, 0.3);
            border-radius: 6px;
            padding: 8px 15px;
            font-weight: 900;
            font-family: 'Urbanist', sans-serif;
            font-size: 1.3rem;
            min-width: 90px;
            text-align: center;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <header class="standings-hero text-center">
        <div class="container">
            <h1 class="fw-black text-white text-uppercase mb-2" style="font-size: 3rem; letter-spacing: -1px;">
                DRIVER <span class="text-danger">STANDINGS</span>
            </h1>
            <p class="text-white-50 font-noto mb-0 fs-5">현재 시즌 드라이버 챔피언십 실시간 순위</p>
        </div>
    </header>

    <section class="py-5" style="min-height: 50vh;">
        <div class="container">
            <div id="driver-standings-container">
                <div class="col-12 text-center text-white-50 py-5">
                    <i class="fa-solid fa-spinner fa-spin fa-3x mb-3"></i>
                    <p class="font-noto">실시간 텔레메트리 데이터를 수신 중입니다...</p>
                </div>
            </div>
            <div class="row g-4 d-none" id="team-standings-container"></div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/circuitData.js"></script>
    <script src="script/common.js"></script>
    <script src="script/standings.js"></script>

    <script src="script/hover-en.js"></script>
    <script src="script/motion.js"></script>
    <script src="script/bgm.js"></script>
</body>
</html>
