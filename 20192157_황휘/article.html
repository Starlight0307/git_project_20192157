<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴스 기사 - PROJECT_TELEMETRY</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/motion.css">
    <link rel="stylesheet" href="css/bgm.css">
    <link rel="stylesheet" href="css/polish.css">

    <style>
        .article-wrap { max-width: 860px; padding-top: 110px; }
        .article-back { color: rgba(255,255,255,0.55); text-decoration: none; font-size: 0.95rem; }
        .article-back:hover { color: #e10600; }
        .article-meta { color: rgba(255,255,255,0.5); font-size: 0.9rem; }
        .article-meta .badge { background: #e10600; font-weight: 700; }
        .article-title { font-size: 2.3rem; font-weight: 900; line-height: 1.3; word-break: keep-all; color: #fff; }
        .article-original { color: rgba(255,255,255,0.4); font-size: 1rem; }
        .article-hero { position: relative; border-radius: 12px; overflow: hidden; background: #16161b; aspect-ratio: 16 / 9; }
        .article-hero img, .article-hero iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
        .article-summary {
            background: rgba(225, 6, 0, 0.08); border-left: 4px solid #e10600; border-radius: 0 10px 10px 0;
            padding: 18px 22px; color: rgba(255,255,255,0.9); font-size: 1.1rem; line-height: 1.7; word-break: keep-all;
        }
        .article-label { color: #e10600; font-weight: 900; font-size: 0.85rem; letter-spacing: 1px; }
        .article-body p { color: rgba(255,255,255,0.85); font-size: 1.08rem; line-height: 1.9; word-break: keep-all; margin-bottom: 1.2rem; }
        .article-hero img.contain { object-fit: contain; background: #f2f2f4; padding: 24px; }  /* 위키백과 서킷 지도 */
        .article-body h3 { color: #fff; font-weight: 900; font-size: 1.45rem; margin: 2.4rem 0 1rem; padding-left: 12px; border-left: 4px solid #e10600; }
        .article-body h4 { color: #fff; font-weight: 700; font-size: 1.15rem; margin: 1.8rem 0 0.8rem; }
        .article-body .en-h { margin-top: -0.6rem !important; }
        .article-body .en { display: none; color: rgba(255,255,255,0.4); font-size: 0.95rem; line-height: 1.6; margin-top: -0.8rem; }
        .article-body.show-en .en { display: block; }
        .article-fade { position: relative; }
        .article-fade::after {  /* 앞부분만 보여 준다는 표시로 마지막 줄을 흐리게 */
            content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 90px;
            background: linear-gradient(rgba(17,17,21,0), #111115); pointer-events: none;
        }
        .article-cta {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 24px;
        }
        .article-cta p { color: rgba(255,255,255,0.6); font-size: 0.92rem; }
        .related-card {
            display: flex; gap: 14px; align-items: center; text-decoration: none; color: #fff;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px;
            transition: border-color 0.2s, background 0.2s;
        }
        .related-card:hover { border-color: rgba(225,6,0,0.6); background: rgba(255,255,255,0.06); color: #fff; }
        .related-card img { width: 120px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: #16161b; }
        .related-card img.map { object-fit: contain; background: #f2f2f4; padding: 4px; }
        .related-card h6 { font-weight: 700; line-height: 1.4; margin: 0; word-break: keep-all;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        @media (max-width: 576px) { .article-title { font-size: 1.6rem; } .related-card img { width: 96px; } }
    </style>
</head>
<body class="font-noto" style="background-color: #111115;">

    <div id="navbar-placeholder"></div>

    <main class="container article-wrap pb-5" id="article-root">
        <div class="text-center text-white-50 py-5"><i class="fa-solid fa-circle-notch fa-spin fs-2"></i><p class="mt-3">기사를 불러오는 중입니다...</p></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/common.js"></script>
    <script src="script/article.js"></script>

    <script src="script/hover-en.js"></script>
    <script src="script/motion.js"></script>
    <script src="script/bgm.js"></script>
</body>
</html>
