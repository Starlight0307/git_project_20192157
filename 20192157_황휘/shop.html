<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>굿즈 샵 - PROJECT_TELEMETRY</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/motion.css">
    <link rel="stylesheet" href="css/bgm.css">
    <link rel="stylesheet" href="css/polish.css">
    <style>
        /* ---------- 히어로 ---------- */
        .shop-hero {
            background: linear-gradient(rgba(17, 17, 21, 0.72), rgba(17, 17, 21, 1)), url('img/circuit/monaco.png') center/cover;
            padding: 130px 0 70px;
            border-bottom: 2px solid #e10600;
        }
        .shop-eyebrow {
            display: inline-block;
            font-family: 'Urbanist', sans-serif;
            font-weight: 900;
            letter-spacing: 0.35em;
            font-size: 0.8rem;
            color: #e10600;
            margin-bottom: 10px;
        }
        #exchange-rate-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            padding: 7px 18px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.82rem;
            font-family: 'Noto Sans KR', sans-serif;
            opacity: 0.6;
            transition: opacity 0.4s ease;
        }
        #exchange-rate-badge.ready { opacity: 1; }
        .rate-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #2ecc71; box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7);
            animation: rate-ping 1.8s infinite;
        }
        @keyframes rate-ping { 70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

        /* ---------- 탭 · 도구 ---------- */
        .shop-toolbar {
            display: flex; flex-wrap: wrap; gap: 16px;
            align-items: flex-end; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 22px;
        }
        .shop-tabs { position: relative; display: flex; gap: 4px; }
        .shop-tab {
            background: none; border: 0;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 1.05rem;
            padding: 14px 22px;
            transition: color 0.25s ease;
        }
        .shop-tab:hover { color: rgba(255, 255, 255, 0.85); }
        .shop-tab.active { color: #fff; }
        #shop-tab-indicator {
            position: absolute; left: 0; bottom: -1px; height: 3px;
            background: linear-gradient(90deg, #e10600, #ff5a4f);
            box-shadow: 0 0 12px rgba(225, 6, 0, 0.8);
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .shop-tools { display: flex; gap: 10px; align-items: center; padding-bottom: 10px; flex-wrap: wrap; }
        .shop-search {
            position: relative;
        }
        .shop-search i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: rgba(255, 255, 255, 0.4); font-size: 0.85rem; }
        .shop-search input, .shop-tools select {
            background: #1a1a1f; color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px;
            padding: 8px 12px; font-family: 'Noto Sans KR', sans-serif; font-size: 0.9rem;
        }
        .shop-search input { padding-left: 34px; width: 220px; }
        .shop-search input:focus, .shop-tools select:focus { outline: none; border-color: #e10600; box-shadow: 0 0 0 3px rgba(225, 6, 0, 0.2); }
        #result-count { color: rgba(255, 255, 255, 0.5); font-size: 0.85rem; font-family: 'Noto Sans KR', sans-serif; white-space: nowrap; }

        /* ---------- 팀 필터 ---------- */
        #team-filter-section { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
        .team-chip {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 6px 14px 6px 10px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: rgba(255, 255, 255, 0.75);
            font-family: 'Urbanist', 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 0.85rem;
            transition: all 0.25s ease;
        }
        .team-chip:hover { border-color: var(--team); color: #fff; transform: translateY(-2px); }
        .team-chip.active { background: var(--team); border-color: var(--team); color: #111; box-shadow: 0 6px 18px color-mix(in srgb, var(--team) 45%, transparent); }
        .team-chip.active .chip-logo { filter: brightness(0); }
        .chip-logo { height: 16px; width: 22px; object-fit: contain; filter: brightness(0) invert(1); }
        .chip-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--team); }
        .chip-count { font-size: 0.72rem; opacity: 0.65; }

        /* ---------- 상품 카드 ---------- */
        .merch-card {
            position: relative; height: 100%;
            display: flex; flex-direction: column;
            background: linear-gradient(160deg, #1e1e24, #141418);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px; overflow: hidden; cursor: pointer;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .merch-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 3;
            background: var(--team);
        }
        .merch-card:hover, .merch-card:focus-visible {
            outline: none;
            border-color: color-mix(in srgb, var(--team) 70%, transparent);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px color-mix(in srgb, var(--team) 40%, transparent), 0 0 30px color-mix(in srgb, var(--team) 25%, transparent);
        }
        .merch-media {
            position: relative; aspect-ratio: 1;
            margin: 12px 12px 0; border-radius: 8px; overflow: hidden;
            background: #e9e9e9;   /* Fuel For Fans 상품 사진의 배경색과 같게 → 사진 테두리가 안 보임 */
        }
        .merch-img {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: contain;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .merch-img-fallback { object-fit: cover; }
        .merch-card:hover .merch-img { transform: scale(1.08) translateY(-2%); }
        .merch-badge {
            position: absolute; top: 10px; left: 10px; z-index: 2;
            padding: 4px 12px; transform: skewX(-12deg);
            background: #e10600; color: #fff;
            font: 900 0.72rem 'Urbanist', sans-serif; letter-spacing: 0.08em;
        }
        .merch-badge.badge-best { background: #111115; }
        .merch-badge.badge-new { background: #e10600; }
        .merch-badge.badge-limited { background: #b8860b; }
        .merch-off {
            position: absolute; top: 10px; right: 10px; z-index: 2;
            padding: 3px 9px; border-radius: 4px;
            background: #ffd400; color: #111;
            font: 900 0.75rem 'Urbanist', sans-serif;
        }
        .merch-body { display: flex; flex-direction: column; flex-grow: 1; padding: 14px 16px 16px; }
        .merch-team {
            display: inline-flex; align-items: center; gap: 6px;
            font: 700 0.72rem 'Urbanist', sans-serif; letter-spacing: 0.06em; text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55); margin-bottom: 6px;
        }
        .merch-team-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--team); box-shadow: 0 0 8px var(--team); }
        .merch-title {
            font: 700 0.95rem/1.4 'Noto Sans KR', sans-serif; color: #fff;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            margin-bottom: 12px; flex-grow: 1;
        }
        .merch-bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
        .merch-prices { display: flex; flex-direction: column; }
        .merch-price { font: 900 1.2rem 'Urbanist', sans-serif; color: #fff; }
        .merch-price-old { font-size: 0.8rem; color: rgba(255, 255, 255, 0.4); text-decoration: line-through; }
        .merch-go {
            width: 34px; height: 34px; flex-shrink: 0;
            display: grid; place-items: center; border-radius: 50%;
            background: rgba(255, 255, 255, 0.06); color: #fff;
            transition: background 0.3s ease, transform 0.3s ease;
        }
        .merch-card:hover .merch-go { background: #e10600; transform: translateX(3px) rotate(-45deg); }

        /* ---------- 상품 상세 ---------- */
        #productModal .modal-content {
            background: #16161b; color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1); border-top: 4px solid var(--team, #e10600);
            border-radius: 12px; overflow: hidden;
        }
        .btn-close-white { filter: invert(1) grayscale(100%) brightness(200%); }
        .modal-img-panel {
            position: relative; height: 100%; min-height: 320px;
            border-radius: 10px; overflow: hidden;
            background: #e9e9e9;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-img-panel #modal-img { max-width: 100%; max-height: 480px; object-fit: contain; }
        .modal-img-panel #modal-logo { position: absolute; left: 16px; bottom: 14px; height: 34px; max-width: 90px; object-fit: contain; opacity: 0.8; }
        #modal-team { color: var(--team, #e10600); font: 900 0.85rem 'Urbanist', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
        .modal-price-old { font-size: 1rem; color: rgba(255, 255, 255, 0.4); text-decoration: line-through; font-weight: 400; margin-right: 10px; }
        .size-selector { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 24px; }
        .size-btn {
            min-width: 52px; padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px;
            background: transparent; color: #fff; font-weight: 700;
            transition: all 0.2s ease;
        }
        .size-btn:hover, .size-btn.active { background: #e10600; border-color: #e10600; }
        .buy-btn {
            position: relative; overflow: hidden;
            display: block; width: 100%; padding: 15px;
            background: #e10600; color: #fff !important; font-weight: 900; font-size: 1.05rem;
            border-radius: 8px; text-align: center; text-decoration: none;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        .buy-btn::after {
            content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: skewX(-20deg); transition: left 0.6s ease;
        }
        .buy-btn:hover { background: #b30500; transform: translateY(-2px); }
        .buy-btn:hover::after { left: 120%; }

        @media (max-width: 576px) {
            .shop-tab { padding: 12px 12px; font-size: 0.95rem; }
            .shop-search input { width: 100%; }
            .shop-tools, .shop-search { width: 100%; }
            .merch-body { padding: 12px; }
            .merch-price { font-size: 1.05rem; }
        }
    </style>
</head>
<body style="background-color: #111115;">
    <div id="navbar-placeholder"></div>

    <header class="shop-hero text-center">
        <div class="container">
            <span class="shop-eyebrow">FUEL FOR FANS · OFFICIAL MERCHANDISE</span>
            <h1 class="fw-black text-white text-uppercase mb-2 font-urbanist" style="font-size: clamp(2.4rem, 7vw, 4rem); letter-spacing: -1px;">
                <span>MERCH</span> <span class="text-danger">STORE</span>
            </h1>
            <p class="text-white-50 font-noto mb-0 fs-5">2026 시즌 팀·드라이버 공식 굿즈를 원화 가격으로 한눈에 비교하세요.</p>
            <div id="exchange-rate-badge"><i class="fa-solid fa-circle-notch fa-spin me-1"></i>환율 불러오는 중...</div>
        </div>
    </header>

    <section class="py-5">
        <div class="container">
            <div class="shop-toolbar">
                <div class="shop-tabs" role="tablist">
                    <button type="button" class="shop-tab active" data-tab="team" role="tab">팀 상품</button>
                    <button type="button" class="shop-tab" data-tab="driver" role="tab">드라이버 컬렉션</button>
                    <button type="button" class="shop-tab" data-tab="sale" role="tab">한정판 / 세일</button>
                    <span id="shop-tab-indicator" aria-hidden="true"></span>
                </div>
                <div class="shop-tools">
                    <div class="shop-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="search" id="shop-search" placeholder="상품 검색 (예: 캡, 티셔츠)" aria-label="상품 검색">
                    </div>
                    <select id="shop-sort" aria-label="정렬">
                        <option value="recommend">추천순</option>
                        <option value="low">가격 낮은순</option>
                        <option value="high">가격 높은순</option>
                        <option value="discount">할인율순</option>
                    </select>
                    <span id="result-count"></span>
                </div>
            </div>

            <div id="team-filter-section"></div>

            <div class="row g-3 g-md-4" id="products-container"></div>

            <p class="text-white-50 small font-noto text-center mt-5 mb-0">
                <i class="fa-solid fa-circle-info me-1"></i>상품 정보와 가격은 Fuel For Fans 기준이며, 원화 가격은 환율로 계산한 참고 금액입니다. 관부가세·해외 배송비는 별도입니다.
            </p>
        </div>
    </section>

    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body p-4 p-md-5 pt-md-3">
                    <div class="row g-4 g-lg-5">
                        <div class="col-lg-6">
                            <div class="modal-img-panel">
                                <img src="" id="modal-img" alt="">
                                <img src="" id="modal-logo" alt="" hidden>
                            </div>
                        </div>
                        <div class="col-lg-6 d-flex flex-column justify-content-center">
                            <p class="mb-1" id="modal-team">TEAM</p>
                            <h2 class="fw-bold font-noto mb-3" id="modal-title">상품명</h2>
                            <p class="fs-2 fw-black font-urbanist text-white mb-1" id="modal-price">₩0</p>
                            <p class="text-white-50 small font-noto mb-4" id="modal-origin-price"></p>
                            <p class="text-white-50 font-noto mb-4" id="modal-desc">상세 설명</p>
                            <div id="size-box">
                                <div class="text-white font-noto fw-bold">사이즈 선택 (EU 기준)</div>
                                <div class="size-selector">
                                    <button type="button" class="size-btn">S</button>
                                    <button type="button" class="size-btn">M</button>
                                    <button type="button" class="size-btn active">L</button>
                                    <button type="button" class="size-btn">XL</button>
                                    <button type="button" class="size-btn">XXL</button>
                                </div>
                            </div>
                            <a href="#" id="modal-buy-link" target="_blank" rel="noopener" class="buy-btn mt-auto">
                                Fuel For Fans에서 구매하기 <i class="fa-solid fa-arrow-up-right-from-square ms-2"></i>
                            </a>
                            <p class="text-white-50 small mt-3 text-center font-noto mb-0">
                                <i class="fa-solid fa-truck-fast me-1"></i>관부가세 및 해외 배송비가 별도로 부과될 수 있습니다.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/common.js"></script>
    <script src="script/shopData.js"></script>
    <script src="script/shop.js"></script>
    <script src="script/hover-en.js"></script>
    <script src="script/motion.js"></script>
    <script src="script/bgm.js"></script>
</body>
</html>
