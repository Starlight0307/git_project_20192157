<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴스 및 분석 - PROJECT_TELEMETRY</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/motion.css">
    <link rel="stylesheet" href="css/bgm.css">
    
    <style>
        .news-hero {
            background: linear-gradient(rgba(17, 17, 21, 0.8), rgba(17, 17, 21, 1)), url('https://images.unsplash.com/photo-1541348263662-e06836264b98?q=80&w=2070&auto=format&fit=crop') center/cover;
            padding: 120px 0 60px 0;
            border-bottom: 2px solid #e10600;
        }

        .news-tabs {
            border-bottom: 2px solid rgba(255,255,255,0.1);
            margin-bottom: 40px;
        }
        .news-tabs .nav-link {
            color: rgba(255,255,255,0.5);
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            padding: 15px 30px;
            border: none;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        .news-tabs .nav-link:hover {
            color: rgba(255,255,255,0.8);
        }
        .news-tabs .nav-link.active {
            color: #fff;
            background: transparent;
            border-bottom: 3px solid #e10600;
        }

        .news-card {
            background-color: #1a1a1f;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: white;
        }
        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            border-color: rgba(225, 6, 0, 0.5);
            color: white;
        }
        .news-img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; 
            overflow: hidden;
            background-color: #000;
        }
        .news-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .news-card:hover .news-img {
            transform: scale(1.05);
        }
        .news-category-badge {
            position: absolute;
            top: 15px; left: 15px;
            background-color: #e10600;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 4px;
            text-transform: uppercase;
            z-index: 2;
            font-family: 'Noto Sans KR', sans-serif;
        }
        
        .video-play-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 3rem;
            z-index: 3;
            transition: color 0.3s ease;
        }
        .news-card:hover .video-play-overlay {
            color: #e10600;
        }

        .news-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .news-date {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 10px;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .news-title {
            font-size: 1.2rem;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 15px;
            font-family: 'Noto Sans KR', sans-serif;
            display: -webkit-box;
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: keep-all;
        }
        .news-desc {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
            font-family: 'Noto Sans KR', sans-serif;
            word-break: keep-all;
        }
        .news-read-more {
            font-size: 0.95rem;
            font-weight: bold;
            color: #e10600;
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: 'Noto Sans KR', sans-serif;
        }
        /* 번역 제목 아래 영어 원문 제목 */
        .news-original {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.35);
            margin: -8px 0 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 사진이 없거나 깨졌을 때 */
        .news-img-empty {
            background: #16161b url('img/favicon.svg') no-repeat center / 64px;
            opacity: 0.25;
        }
        /* 경기 리포트: 위키백과 서킷 지도(흰 바탕 그림)는 잘리지 않게 */
        .news-img.news-img-map { object-fit: contain; background: #f2f2f4; padding: 14px; }
        /* 탭 위 출처·업데이트 시각 */
        .news-source-line {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.45);
            font-family: 'Noto Sans KR', sans-serif;
            margin-bottom: -8px;
        }
        .news-source-line a { color: rgba(255,255,255,0.75); }

        .loading-spinner {
            text-align: center;
            padding: 80px 0;
            color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body style="background-color: #111115;">

    <div id="navbar-placeholder"></div>

    <header class="news-hero text-center" id="hero-header">
        <div class="container">
            <h1 class="fw-black text-white text-uppercase mb-2 font-urbanist" style="font-size: 3.5rem; letter-spacing: -1px;" id="hero-title">
                뉴스 & <span class="text-danger">분석</span>
            </h1>
            <p class="text-white-50 font-noto mb-0 fs-5" id="hero-subtitle">가장 빠른 F1 소식과 심층 분석을 한국어로 만나보세요.</p>
        </div>
    </header>

    <section class="py-5">
        <div class="container">
            
            <ul class="nav nav-tabs news-tabs justify-content-center" id="newsTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="latest-tab" data-bs-toggle="tab" data-bs-target="#latest" type="button" role="tab">최신 소식</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="report-tab" data-bs-toggle="tab" data-bs-target="#report" type="button" role="tab">경기 리포트</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tech-tab" data-bs-toggle="tab" data-bs-target="#tech" type="button" role="tab">테크 토크</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="column-tab" data-bs-toggle="tab" data-bs-target="#column" type="button" role="tab">칼럼/블로그</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="video-tab" data-bs-toggle="tab" data-bs-target="#video" type="button" role="tab">영상 뉴스</button>
                </li>
            </ul>

            <div class="tab-content" id="newsTabContent">
                
                <div class="tab-pane fade show active" id="latest" role="tabpanel">
                    <div class="row g-4" id="latest-news-container">
                        <div class="col-12 loading-spinner"><i class="fa-solid fa-circle-notch fa-spin fs-2"></i><p class="mt-3 font-noto">실시간 최신 소식을 불러오는 중입니다...</p></div>
                    </div>
                </div>

                <div class="tab-pane fade" id="report" role="tabpanel">
                    <div class="row g-4" id="report-news-container">
                        <div class="col-12 loading-spinner"><i class="fa-solid fa-circle-notch fa-spin fs-2"></i><p class="mt-3 font-noto">그랑프리 경기 리포트를 불러오는 중입니다...</p></div>
                    </div>
                </div>

                <div class="tab-pane fade" id="tech" role="tabpanel">
                    <div class="row g-4" id="tech-news-container">
                        <div class="col-12 loading-spinner"><i class="fa-solid fa-circle-notch fa-spin fs-2"></i><p class="mt-3 font-noto">엔지니어링 테크 토크를 불러오는 중입니다...</p></div>
                    </div>
                </div>

                <div class="tab-pane fade" id="column" role="tabpanel">
                    <div class="row g-4" id="column-news-container">
                        <div class="col-12 loading-spinner"><i class="fa-solid fa-circle-notch fa-spin fs-2"></i><p class="mt-3 font-noto">전문가 칼럼 및 블로그를 불러오는 중입니다...</p></div>
                    </div>
                </div>

                <div class="tab-pane fade" id="video" role="tabpanel">
                    <div class="row g-4" id="video-news-container">
                        <div class="col-12 loading-spinner"><i class="fa-solid fa-circle-notch fa-spin fs-2"></i><p class="mt-3 font-noto">유튜브 서버에서 영상 뉴스를 가져오는 중입니다...</p></div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/common.js"></script>
    <script src="script/news.js"></script>

    <script src="script/hover-en.js"></script>
    <script src="script/motion.js"></script>
    <script src="script/bgm.js"></script>
</body>
</html>
