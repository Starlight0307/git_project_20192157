<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>드라이버 라인업 - PROJECT_TELEMETRY</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/motion.css">
    <link rel="stylesheet" href="css/bgm.css">
    <link rel="stylesheet" href="css/polish.css">
    
    <style>
        .driver-hero {
            background: linear-gradient(rgba(17, 17, 21, 0.8), rgba(17, 17, 21, 1)), url('https://images.unsplash.com/photo-1504454663576-2a6f7380b567?q=80&w=2070&auto=format&fit=crop') center/cover;
            padding: 130px 0 60px 0;
            border-bottom: 2px solid #e10600;
        }

        .f1-driver-card {
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
            border: none;
            position: relative;
            cursor: pointer; 
        }

        .f1-driver-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .f1-card-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(rgba(0,0,0,0.15) 1px, transparent 1px);
            background-size: 4px 4px;
            z-index: 1;
            pointer-events: none;
        }

        .f1-card-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-grow: 1; 
        }

        .f1-card-top {
            height: 240px;
            display: flex;
            padding: 25px;
            position: relative;
        }

        .f1-info-left {
            display: flex;
            flex-direction: column;
            width: 65%;
        }

        /* 사진 확대 버그 제거 */
        .f1-photo-right {
            position: absolute;
            bottom: 0;
            right: 15px;
            height: 105%;
            z-index: 3;
            filter: drop-shadow(-10px 10px 15px rgba(0,0,0,0.4));
        }

        .f1-first-name {
            display: block;
            font-family: 'Urbanist', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: -5px;
        }

        .f1-last-name {
            display: block;
            font-family: 'Urbanist', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            line-height: 1;
        }

        .f1-team-name {
            font-size: 0.85rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 5px;
        }

        .f1-number-img {
            height: 40px;
            margin-top: 15px;
            opacity: 0.95;
        }

        .f1-flag {
            margin-top: auto;
        }

        .f1-flag img {
            width: 32px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .f1-card-bottom {
            padding: 20px;
            background-color: #1a1a1e; 
            border-top: 1px solid rgba(255,255,255,0.1);
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .champion-badge {
            background-color: #FFD700;
            color: #000;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            display: inline-block;
        }

        .stats-loading {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
        }

        .modal-content-custom {
            background-color: #15151e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        .stats-section-title {
            font-family: 'Urbanist', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: -1px;
        }
        .stat-box {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .stat-label {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 900;
            font-family: 'Urbanist', sans-serif;
        }
        .bg-darker {
            background-color: #1f1f27;
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <header class="driver-hero text-center">
        <div class="container">
            <h1 class="fw-black text-white text-uppercase mb-2" id="hero-title" style="font-size: 3rem; letter-spacing: -1px;">
                DRIVER <span class="text-danger">LINEUP</span>
            </h1>
            <p class="text-white-50 font-noto mb-0 fs-5">공식 팀 드라이버 프로필</p>
        </div>
    </header>

    <section class="py-5">
        <div class="container">
            <div id="driver-list-container" class="row g-4">
                </div>
        </div>
    </section>

    <div class="modal fade" id="driverDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content modal-content-custom text-white">
                <div class="modal-header border-0 pb-0" id="modalHeaderColor">
                    <h2 class="modal-title fw-black font-urbanist ms-2 mt-2" id="modalDriverName" style="font-size: 2.5rem; letter-spacing: -1px;">DRIVER NAME</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0 mt-3 font-noto">
                    <div class="row g-0">
                        <div class="col-md-5 p-5 border-end border-secondary">
                            <h3 class="stats-section-title text-danger" id="m-season-title">해당 시즌</h3>
                            
                            <div class="row mt-4">
                                <div class="col-6 stat-box">
                                    <div class="stat-label">시즌 순위</div>
                                    <div class="stat-value text-white" id="m-season-pos">-</div>
                                </div>
                                <div class="col-6 stat-box">
                                    <div class="stat-label">획득 포인트</div>
                                    <div class="stat-value text-white" id="m-season-pts">-</div>
                                </div>
                                <div class="col-6 stat-box border-0 mb-0">
                                    <div class="stat-label">시즌 우승 횟수</div>
                                    <div class="stat-value text-white" id="m-season-wins">-</div>
                                </div>
                                <div class="col-6 stat-box border-0 mb-0">
                                    <div class="stat-label">시즌 포디움</div>
                                    <div class="stat-value text-white" id="m-season-podiums">-</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-md-7 p-5 bg-darker">
                            <h3 class="stats-section-title text-danger">커리어 통계</h3>
                            
                            <div class="stat-box d-flex justify-content-between align-items-center mt-4">
                                <span class="stat-label mb-0">그랑프리 출전 횟수</span>
                                <span class="stat-value fs-4 text-white" id="m-career-entered">-</span>
                            </div>
                            <div class="stat-box d-flex justify-content-between align-items-center">
                                <span class="stat-label mb-0">커리어 누적 포인트</span>
                                <span class="stat-value fs-4 text-white" id="m-career-pts">-</span>
                            </div>
                            <div class="stat-box d-flex justify-content-between align-items-center">
                                <span class="stat-label mb-0">최고 레이스 순위</span>
                                <span class="stat-value fs-4 text-white" id="m-career-highest">-</span>
                            </div>
                            <div class="stat-box d-flex justify-content-between align-items-center">
                                <span class="stat-label mb-0">총 포디움 횟수</span>
                                <span class="stat-value fs-4 text-white" id="m-career-podiums">-</span>
                            </div>
                            <div class="stat-box d-flex justify-content-between align-items-center">
                                <span class="stat-label mb-0">폴 포지션</span>
                                <span class="stat-value fs-4 text-white" id="m-career-poles">-</span>
                            </div>
                            <div class="stat-box d-flex justify-content-between align-items-center border-0 mb-0 pb-0">
                                <span class="stat-label mb-0">월드 챔피언십 달성</span>
                                <span class="stat-value fs-4 text-warning" id="m-career-champs">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/circuitData.js"></script>
    <script src="script/common.js"></script>
    <script src="script/drivers.js"></script>

    <script src="script/hover-en.js"></script>
    <script src="script/motion.js"></script>
    <script src="script/bgm.js"></script>
</body>
</html>
